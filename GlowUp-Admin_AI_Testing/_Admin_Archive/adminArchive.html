<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowUp Admin - Archive</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../_Shared/assets/glowup-icon-32.png">
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("glowup.theme"); } catch (e) { }
            if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.dataset.theme = t;
        })();
        setTimeout(function () {
            if (document.documentElement.classList.contains("auth-pending")) document.documentElement.classList.add("auth-stuck");
        }, 10000);
    </script>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
    <link rel="modulepreload" href="../_Database/firebase-console.js">
    <link rel="modulepreload" href="../_Shared/adminCommon.js">
    <link rel="modulepreload" href="../_Shared/adminStore.js">
    <link rel="modulepreload" href="../_Shared/adminShell.js">
    <link rel="modulepreload" href="../_Shared/adminLayouts.js">
    <link rel="modulepreload" href="../_Shared/adminArchive.js">
    <link rel="stylesheet" href="../_Shared/adminCommon.css">
    <link rel="stylesheet" href="../_Shared/adminSettingsMenu.css">
    <link rel="stylesheet" href="../_Admin_Recycle_Bin/adminRecycleBin.css">
    <link rel="stylesheet" href="../_Admin_Archive/adminArchive.css">
</head>
<body>

    <main class="main-content" data-title="Archive" data-subtitle="What left the Recycle bin: kept 30 days, then deleted">

        <script src="../_Shared/pageFrame.js"></script>

        <div data-header-parts hidden>
                    <div class="segmented header-tabs" id="archiveTabs" role="tablist" aria-label="What to show">
                        <button type="button" class="seg" role="tab" data-kind="ingredients"><i data-icon="flask"></i>Ingredients <span class="tab-count" id="countIngredients"></span></button>
                        <button type="button" class="seg" role="tab" data-kind="brands"><i data-icon="tag"></i>Brands <span class="tab-count" id="countBrands"></span></button>
                        <button type="button" class="seg" role="tab" data-kind="products"><i data-icon="lipstick"></i>Products <span class="tab-count" id="countProducts"></span></button>
                    </div>
                    <div class="search-container">
                        <i data-icon="search"></i>
                        <input type="text" placeholder="Search the Archive" class="search-input" id="archiveSearchInput" autocomplete="off" aria-label="Search the Archive">
                        <button type="button" class="search-clear" id="archiveSearchClear" aria-label="Clear the search" hidden><i data-icon="x"></i></button>
                    </div>
                    <div data-header-end>
                        <a class="btn" href="../_Admin_Recycle_Bin/adminRecycleBin.html" data-tip="Back to the Recycle bin."><i data-icon="trash"></i>Recycle bin</a>
                    <button type="button" class="guide-badge" data-tip-title="How the Archive works" data-tip="Entries moved here from the Recycle bin are kept 30 days, counted from the day they were archived, then a daily job on the server deletes them for good. Restore puts an entry back in the Recycle bin as it was. Delete now removes it at once, after a copy is saved to your computer.">i</button>
                    </div>
        </div>
        <div class="board">


            <section class="panel" data-panel="list" data-label="Archived entries" data-w="12" data-source="archive">
                <div class="panel-head">
                    <button type="button" class="pick" id="archivePickAll" role="checkbox" aria-checked="false" aria-label="Select all shown" data-tip="Select every entry shown here."></button>
                    <h3 class="panel-title" id="archiveTitle">Archived ingredients</h3>
                    <span class="panel-count" id="archiveCountLine"></span>
                    <span class="spacer"></span>
                    <div class="pager" id="archivePagerTop"></div>
                </div>

                <div class="w-bar sel-bar" id="archiveBar" hidden>
                    <b id="archiveBarCount">0 selected</b>
                    <span class="spacer"></span>
                    <button type="button" class="btn" id="archiveRestoreSelectedBtn"><i data-icon="undo"></i>Restore selected</button>
                    <button type="button" class="btn danger" id="archiveDeleteSelectedBtn"><i data-icon="trash"></i>Delete selected now</button>
                    <button type="button" class="btn" id="archiveClearSelectedBtn">Cancel</button>
                </div>
                <div class="table-container">
                    <table class="admin-table bin-table archive-table">
                        <thead>
                            <tr><th class="pick-col"></th><th>Name</th><th>Archived</th><th>By</th><th>Deleted in</th><th></th></tr>
                        </thead>
                        <tbody id="archiveTableBody">
                            <tr><td colspan="6"><div class="sk-list"><div class="sk-line-row"><i class="sk sk-dot"></i><span><i class="sk sk-text w60"></i><i class="sk sk-text w35 thin"></i></span><i class="sk sk-pill"></i></div><div class="sk-line-row"><i class="sk sk-dot"></i><span><i class="sk sk-text w60"></i><i class="sk sk-text w35 thin"></i></span><i class="sk sk-pill"></i></div></div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" id="archiveEmpty" hidden>
                    <p class="empty-message" id="archiveEmptyMessage">The Archive is empty.</p>
                    <span class="empty-hint" id="archiveEmptyHint">Entries moved here from the Recycle bin are kept 30 days.</span>
                </div>
                <div class="table-foot"><span class="spacer"></span><div class="pager" id="archivePager"></div></div>
            </section>
        </div>
    </main>

    <script type="module" src="../_Admin_Archive/adminArchive.js"></script>
</body>
</html>
