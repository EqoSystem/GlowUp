<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowUp Admin Portal</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../_Shared/assets/glowup-icon-32.png">
    <script>
        // dark or light before anything is drawn: the person's choice, else the computer's own setting
        (function () {
            var t = null;
            try { t = localStorage.getItem("glowup.theme"); } catch (e) { }
            if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <link rel="stylesheet" href="../_Shared/adminCommon.css">
    <link rel="stylesheet" href="../_Index/indexStyle.css">
</head>
<body class="login-page">
    <script src="../_Shared/pageSkeleton.js"></script>

    <div class="login-tools" id="loginTools"></div>

    <div class="login-card">
        <div class="icon-box"><i data-icon="lock"></i></div>
        <h1>GlowUp Admin</h1>
        <p class="subtitle">Authorized personnel only</p>

        <form id="login-form" novalidate>
            <div class="field">
                <label for="username">Email</label>
                <input type="email" id="username" placeholder="you@example.com" autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <!-- the eye at the right shows the password while it is typed, and hides it again -->
                <div class="password-box">
                    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
                    <button type="button" id="passwordEye" class="password-eye" aria-label="Show the password" aria-pressed="false">
                        <svg class="ic eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="ic eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.3 6.4C3.6 8.3 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2"/></svg>
                    </button>
                </div>
            </div>

            <p id="loginMessage" class="login-message form-error" role="alert"></p>

            <div class="login-action">
                <button type="submit" id="loginBtn" class="login-btn" disabled>Log in</button>
                <button type="button" class="guide-badge" data-tip-title="Log in" data-tip="Type the admin email and password. The button lights up when both boxes are filled." data-tip-preview="Opens the Operations Dashboard.">i</button>
            </div>
        </form>

        <p class="footer-note">Sign-in attempts are recorded.</p>
    </div>

    <script type="module" src="../_Index/indexApp.js"></script>
</body>
</html>
